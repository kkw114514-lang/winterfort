name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.424

      - name: Restore dependencies
        run: dotnet restore src/Kernel.Headless/Kernel.Headless.csproj

      - name: Build combat kernel
        run: dotnet build src/Kernel.Headless/Kernel.Headless.csproj --configuration Debug --no-restore

      - name: Run headless checks
        run: dotnet run --project src/Kernel.Headless/Kernel.Headless.csproj --configuration Debug --no-build
